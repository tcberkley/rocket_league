[package]
name = "rl-viewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rl-viewer"
path = "src/main.rs"

[dependencies]
wgpu = "22"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
